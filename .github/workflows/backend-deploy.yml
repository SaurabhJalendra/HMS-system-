# Deploy ZenHosp backend to EC2 on push to main (or manual dispatch).
# Requires repository secrets — see docs/RELEASE_AND_UPDATES.md

name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - "hms-desktop/backend/**"
      - "hms-desktop/release/version.json"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

concurrency:
  group: zenhosp-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync release manifest into backend data
        run: node hms-desktop/scripts/sync-release-version.mjs
        working-directory: .

      - name: Validate EC2 Secrets
        if: env.EC2_HOST == '' || env.EC2_SSH_KEY == ''
        run: |
          echo "::notice title=Automatic EC2 Deploy Skipped::EC2 secrets (EC2_HOST, EC2_SSH_KEY) are not set in GitHub repository secrets. To enable automatic backend deployment on push to main, add EC2_HOST, EC2_USER, and EC2_SSH_KEY in Repository Settings -> Secrets and variables -> Actions."

      - name: Deploy over SSH
        if: env.EC2_HOST != '' && env.EC2_SSH_KEY != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.EC2_APP_DIR || '/home/ubuntu/HMS-system-/hms-desktop' }}"
            cd "$APP_DIR/backend"

            git fetch origin main
            git checkout main
            git pull origin main

            node ../scripts/sync-release-version.mjs || true

            npm ci
            npx prisma migrate deploy
            npm run build

            export APP_VERSION="$(node -p "require('../release/version.json').version")"
            export MINIMUM_DESKTOP_VERSION="$(node -p "require('../release/version.json').minimumDesktopVersion")"
            export LATEST_DESKTOP_VERSION="$(node -p "require('../release/version.json').latestDesktopVersion")"

            pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
            pm2 save

            echo "Verifying backend health on port 3000..."
            HEALTHY=0
            for i in $(seq 1 15); do
              if curl -sf "http://127.0.0.1:3000/api/version" > /dev/null 2>&1; then
                echo "✓ Backend API is live on port 3000:"
                curl -s "http://127.0.0.1:3000/api/version"
                HEALTHY=1
                break
              fi
              echo "Waiting for backend process to initialize... ($i/15)"
              sleep 2
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "::warning::Backend process restarted, but /api/version was not reachable within 30s. Check: pm2 logs zenhosp-api"
            fi
