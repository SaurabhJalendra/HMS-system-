# Build ZenHosp Windows installer and publish update artifacts.
# Triggers on version tags (v*) or manual dispatch.
#
# Required Actions secret for a clinic-ready installer:
#   VITE_API_URL = http://<ec2-host>:3000/api
# Without it, Vite bakes http://localhost:3000/api into the .exe.

name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_s3:
        description: "Upload to S3 after build"
        required: false
        default: "false"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hms-desktop/package-lock.json

      - name: Install dependencies
        working-directory: hms-desktop
        run: npm ci

      - name: Sync version from tag
        shell: bash
        working-directory: hms-desktop
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            node -e "
              const fs = require('fs');
              const p = 'package.json';
              const pkg = JSON.parse(fs.readFileSync(p,'utf8'));
              const v = process.argv[1];
              if (!v) throw new Error('Missing tag version in argv');
              pkg.version = v;
              fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
            " "$TAG"
          fi
          node scripts/sync-release-version.mjs

      - name: Generate update feed config
        working-directory: hms-desktop
        env:
          ZENHOSP_UPDATE_FEED_URL: ${{ secrets.ZENHOSP_UPDATE_FEED_URL }}
        run: node scripts/generate-update-config.mjs

      - name: Build backend (for bundled version file)
        working-directory: hms-desktop/backend
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Build Windows installer
        working-directory: hms-desktop
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run make

      - name: Collect installer artifacts
        working-directory: hms-desktop
        run: node scripts/collect-installer-artifacts.mjs

      - name: Upload artifact (GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: zenhosp-windows-installer
          path: hms-desktop/release/installer-artifacts/
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hms-desktop/release/installer-artifacts/*
          generate_release_notes: true

      - name: Publish to S3
        if: secrets.ZENHOSP_UPDATE_S3_BUCKET != '' && (github.event_name == 'push' || github.event.inputs.publish_s3 == 'true')
        working-directory: hms-desktop
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ZENHOSP_UPDATE_S3_BUCKET: ${{ secrets.ZENHOSP_UPDATE_S3_BUCKET }}
          ZENHOSP_UPDATE_S3_PREFIX: ${{ secrets.ZENHOSP_UPDATE_S3_PREFIX }}
        run: node scripts/publish-desktop-release.mjs
